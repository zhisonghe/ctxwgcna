[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxwgcna"
version = "0.1.0"
description = "Context-aware WGCNA: union of context-specific co-expression with a context-restricted TOM"
requires-python = ">=3.10"
# dynamicTreeCut pinned: verified identical to R dynamicTreeCut (PAM off).
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "dynamicTreeCut==0.1.1"]

[project.optional-dependencies]
test = ["pytest", "scikit-learn", "anndata"]
anndata = ["anndata"]
docs = ["matplotlib"]
jupyter = ["ipykernel", "anndata"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
